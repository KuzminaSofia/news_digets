[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digest-engine"
version = "0.1.0"
description = "Config-driven news digest engine: fetch RSS sources, summarize with an LLM, deliver to Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "tenacity>=8.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
run-digest = "digest_engine.cli:main"

[tool.setuptools.packages.find]
include = ["digest_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
