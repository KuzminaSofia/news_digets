name: Digest

on:
  schedule:
    - cron: "0 3 * * *"   # 06:00 Europe/Moscow (03:00 UTC)
  workflow_dispatch:
    inputs:
      config_name:
        description: "Config file name in configs/ (without .yml)"
        type: string
        default: "torchlab-ai"
      dry_run:
        description: "Build & log the digest but do not deliver"
        type: boolean
        default: false

# Allow the optional state-commit step to push back to the repo.
permissions:
  contents: write

concurrency:
  group: digest-${{ github.event.inputs.config_name || 'torchlab-ai' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    services:
      rsshub:
        image: diygod/rsshub:latest
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      CONFIG_NAME: ${{ github.event.inputs.config_name || 'torchlab-ai' }}
      DRY_RUN_FLAG: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_REFERER: ${{ secrets.OPENROUTER_REFERER }}
          OPENROUTER_TITLE: ${{ secrets.OPENROUTER_TITLE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/run_digest.py --config "configs/${CONFIG_NAME}.yml" ${DRY_RUN_FLAG}

      # Only relevant if a config uses state.type: json. Harmless otherwise
      # (the commit is skipped when there are no changes).
      - name: Persist dedup state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain state/ 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update dedup state [skip ci]"
            git push
          else
            echo "No state changes to commit."
          fi
